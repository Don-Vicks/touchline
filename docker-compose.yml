services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: touchline
      POSTGRES_PASSWORD: touchline
      POSTGRES_DB: touchline
    ports:
      - "5433:5432"
    volumes:
      - touchline-pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  touchline-pg:
